services:
  # FastAPI 后端服务
  - type: web
    name: rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # 只保留不敏感的配置
      - key: LLM_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: LLM_TIMEOUT
        value: 60
      - key: UPLOAD_DIR
        value: /tmp/uploads
    healthCheckPath: /health

  # Streamlit 前端服务
  - type: web
    name: rag-streamlit
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.streamlit
    envVars:
      - key: API_BASE_URL
        value: https://rag-api.onrender.com
